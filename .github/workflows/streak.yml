name: Update streak stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: assets/streak.svg
          options: user=Akuvent&theme=github-dark-blue&hide_border=true&ring=F2EBE4&fire=F2EBE4&currStreakLabel=F2EBE4&border_radius=12
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --staged --quiet || git commit -m "Update GitHub streak card."
          git push
